services:
  - type: web
    name: coffee-advisor
    runtime: python
    # The Opus-MT translator is ~80 MB, small enough for any plan. What needs
    # the room is the e5 classifier and its torch, so USE_REAL_AI=1 still
    # wants more than the 512 MB free plan. Standard = 2 GB.
    plan: standard
    # Models are downloaded here, at build time, into the project folder that
    # Render ships to the runtime: a boot only loads them from disk.
    buildCommand: pip install -r requirements-ai.txt && python scripts/fetch_models.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: HF_HOME
        value: /opt/render/project/src/.hf_cache
      - key: USE_REAL_AI
        value: "1"
      # 0: messages to real numbers really go out through Africa's Talking.
      # Demo numbers (+256799...) never do, whatever this says.
      - key: DEMO_MODE
        value: "0"
      # Second opinion: an Ollama server reachable from Render (e.g. a laptop
      # behind a tunnel). Unset or unreachable -> the classifier answers alone.
      - key: USE_LLM
        value: "1"
      - key: OLLAMA_HOST
        sync: false
      - key: OLLAMA_TIMEOUT
        value: "30"
      # The disk is wiped on every deploy; demo conversations are disposable.
      - key: DB_PATH
        value: /tmp/coffee.db
      - key: AT_USERNAME
        value: sandbox
      - key: AT_API_KEY
        sync: false
      - key: AGENT_PHONE
        sync: false
      - key: DEMO_LIVE_PHONE
        sync: false
      # English subtitles on the demo page. Unset -> Google's free endpoint.
      - key: GOOGLE_TRANSLATE_API_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        value: "*"
